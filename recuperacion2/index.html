<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking FIP 2024</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="IMAGE/logo.png" alt="Logo Federación">
            </div>
            <div class="menu-toggle" id="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="menu" id="menu">
                <li><a href="#">Nosotros</a></li>
                <li><a href="#">Torneos</a></li>
                <li><a href="#">Rankings</a></li>
                <li><a href="#">Federaciones</a></li>
                <li><a href="#">Documentation</a></li>
                <li><a href="#">Prensa & Media</a></li>
                <li><a href="#">Courses</a></li>
                <li class="busqueda">
                    <input type="text" id="search" placeholder="Buscar...">
                    <button onclick="buscarJugador()">🔍</button>
                </li>
                <li class="idioma">
                    <select id="language" onchange="cambiarIdioma()">
                        <option value="es">Español</option>
                        <option value="en">English</option>
                    </select>
                </li>
                <li class="social">
                    <a href="#"><img src="IMAGE/FACEBOOK.png" alt="Facebook"></a>
                    <a href="#"><img src="IMAGE/twitter.png" alt="Twitter"></a>
                    <a href="#"><img src="IMAGE/Instagram.png" alt="Instagram"></a>
                </li>
            </ul>
        </nav>
        
        
    </header>

    <main>
        <section class="ranking">
            <div class="nav-buttons left">
                <a onclick="mostrarJugador(-1)" class="nav-btn">&#60;</a>
            </div>
            <div id="cards"></div>
            <div class="nav-buttons right">
                <a onclick="mostrarJugador(1)" class="nav-btn">&#62;</a>
            </div>
        </section>
        <div class="pagination">
            <span onclick="mostrarJugadorPorNumero(0)">1</span>
            <span onclick="mostrarJugadorPorNumero(1)">2</span>
            <span onclick="mostrarJugadorPorNumero(2)">3</span>
            <span onclick="mostrarJugadorPorNumero(3)">4</span>
            <span onclick="mostrarJugadorPorNumero(4)">5</span>
            <span onclick="mostrarJugadorPorNumero(5)">6</span>
            <span onclick="mostrarJugadorPorNumero(6)">7</span>
            <span onclick="mostrarJugadorPorNumero(7)">8</span>
            <span onclick="mostrarJugadorPorNumero(8)">9</span>
            <span onclick="mostrarJugadorPorNumero(9)">10</span>
        </div>
    </main>

    <footer>
        <p>Realizado por: Simon Gonzalez Cabrera</p>
    </footer>
</body>
</html>
